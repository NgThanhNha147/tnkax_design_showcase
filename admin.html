<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị tnkax_design</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"></head>
<body class="admin-body">
  <section id="login" class="login"><form id="login-form"><h1>ADMIN</h1><p>Đăng nhập để quản lý kho mẫu.</p><input name="username" type="email" placeholder="Email admin" required><input name="password" type="password" placeholder="Mật khẩu" required><button>Đăng nhập</button><small id="login-error"></small></form></section>
  <main id="dashboard" class="dashboard" hidden>
    <aside><a class="logo" href="/">tnkax<small>_design</small></a><h2>Quản trị</h2><button data-tab="products" class="active">Sản phẩm</button><button data-tab="categories">Danh mục</button><a href="/" target="_blank">Xem website ↗</a><button id="logout">Đăng xuất</button></aside>
    <section class="admin-main"><div id="products-tab"><div class="admin-head"><div><small>KHO MẪU</small><h1>Sản phẩm</h1></div><button id="add-product">+ Thêm sản phẩm</button></div><div id="admin-products" class="admin-products"></div></div><div id="categories-tab" hidden><div class="admin-head"><h1>Danh mục</h1></div><form id="category-form" class="category-form"><input name="name" placeholder="Tên danh mục mới" required><button>Thêm</button></form><div id="admin-categories"></div></div></section>
  </main>
  <dialog id="product-dialog"><form id="product-form"><input type="hidden" name="id"><h2 id="form-title">Thêm sản phẩm</h2><label>Tên mẫu<input name="title" required></label><label>Danh mục<select name="category" required></select></label><label>Mô tả<textarea name="description" rows="3"></textarea></label><label>Ảnh<input name="file" type="file" accept="image/*"><small>Hoặc dán URL ảnh</small><input name="image"></label><label>Lượt xem<input name="views" type="number" min="0" value="0"></label><div><button type="button" id="cancel">Hủy</button><button type="submit">Lưu sản phẩm</button></div></form></dialog>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
